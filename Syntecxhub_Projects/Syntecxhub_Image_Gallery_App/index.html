<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="head">
    <h1>Image Gallery</h1>
    <p>Hover over a picture to zoom in and read its caption.</p>
  </header>

  <main class="gallery">
    <figure class="item" tabindex="0"><img src="images/photo1.svg" alt="Warm orange hills at sunrise"><figcaption>Morning Hills</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo2.svg" alt="Blue lake under a clear sky"><figcaption>Calm Lake</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo3.svg" alt="Green forest hills"><figcaption>Forest Path</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo4.svg" alt="Golden desert dunes at sunset"><figcaption>Sunset Dunes</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo5.svg" alt="Starry night sky with a moon"><figcaption>Night Sky</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo6.svg" alt="Mint green valley"><figcaption>Mint Valley</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo7.svg" alt="Pink sky above a quiet lake"><figcaption>Rose Horizon</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo8.svg" alt="Sandy dunes in warm light"><figcaption>Desert Wind</figcaption></figure>
    <figure class="item" tabindex="0"><img src="images/photo9.svg" alt="Evening ocean in blue light"><figcaption>Ocean Dusk</figcaption></figure>
  </main>

  <footer class="foot">Syntecxhub Front-End Development Internship, Project 3</footer>
</body>
</html>
